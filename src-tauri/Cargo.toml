[package]
name = "switchboard"
version = "0.1.0"
description = "Provider, model and credential console for OpenCode"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "switchboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
dirs = "6"

[profile.dev]
debug = 0
incremental = false
